[workspace]
members = ["crates/campaign-core", "crates/campaign-cli"]
exclude = ["ttrpg-gm-cm-app/src-tauri"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "io-util", "io-std"] }
