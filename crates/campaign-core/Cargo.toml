[package]
name = "campaign-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
# Temporary adapter used by the existing desktop app during migration.
legacy-sqlite = ["dep:rusqlite"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
sha2 = "0.10"
tempfile = "3"
rusqlite = { version = "0.38", features = ["bundled"], optional = true }
turso = { version = "=0.8.0", default-features = false }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
schemars = "1"

[dev-dependencies]
tokio.workspace = true
